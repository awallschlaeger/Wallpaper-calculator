<script>

var SK='wallpaper_pro_v1';
var BASE_R=3.00,BASE_N=4.00,BASE_H=4.00,PRIMER=1.30;
var INSTALL_MIN=925,POWDER_MIN=925,ACCENT_MIN=750,ACCENT_MIN_EACH=600;
var SPACES=[
  {v:'accent_wall',l:'Accent wall',m:1.1},{v:'bath',l:'Bathroom',m:1.2},{v:'bedroom',l:'Bedroom',m:1.0},
  {v:'ceiling',l:'Ceiling',m:2.0},{v:'closet',l:'Closet',m:1.2},{v:'dining_room',l:'Dining room',m:1.0},

];
var MATS_R=[{v:'nonwoven',l:'Nonwoven',m:1.0},{v:'vinyl50',l:'50in Vinyl',m:1.1},{v:'spoonflower',l:'Spoonflower',m:1.2}];
var MATS_H=[{v:'natural',l:'Natural / Organic',m:1.0},{v:'highend',l:'High-end',m:1.3,adj:true}];
var CH_H=[7,8,9,10,12,14,15,16,18];
var CH_M={7:1,8:1,9:1,10:1.2,12:1.25,14:1.3,15:1.35,16:1.4,18:1.5};
var PITCH={straight:1,shallow:1.1,medium:1.15,steep:1.2};
var PATS=[{v:'random',l:'Random / no match',m:1.0},{v:'pattern',l:'Pattern match',m:1.1},{v:'mural',l:'Mural',m:1.3}];
var LADS=[{v:'standard',l:'Standard',flat:0,m:0.95},{v:'specialized',l:'Specialized ladder',flat:125,m:1.15},{v:'scaffolding_small',l:'Scaffolding (small)',flat:200,m:1.15},{v:'scaffolding_large',l:'Scaffolding (large)',flat:300,m:1.2},{v:'scissor_lift',l:'Scissor lift',flat:800,m:1.25}];
var PT=[
  {label:'-- select --'},
  {label:"European 20.5in x 33ft",width:20.5,rollFt:33},
  {label:"European 21in x 33ft",width:21,rollFt:33},
  {label:"American 27in x 27ft",width:27,rollFt:27},
  {label:"8-yard (custom width)",rollFt:24,cw:true},
  {label:"12-yard (custom width)",rollFt:36,cw:true},

  {label:"Commercial 54in / 30-yd",width:54,rollFt:90},
  {label:"Custom",custom:true}
];
var DIFFS=[1.0,1.1,1.2,1.3];
var WAINSCOTS=[{v:0,l:'None'},{v:0.15,l:'15% off'},{v:0.25,l:'25% off'},{v:0.35,l:'35% off'}];
var COVERAGES=[{v:0,l:'None'},{v:0.15,l:'15% off'},{v:0.25,l:'25% off'},{v:0.35,l:'35% off'}];

var GAPI_CLIENT_ID='250555791616-nphdmqc5jknc1bts3ucg2u21b7inbh8c.apps.googleusercontent.com';
var GAPI_SCOPE='https://www.googleapis.com/auth/drive.appdata';
var GAPI_FILE_NAME='wallpaper-jobs.json';
var GDrive={ready:false,token:null,fileId:null,status:''};

function gLoadGAPI(){
  var s=document.createElement('script');
  s.src='https://accounts.google.com/gsi/client';
  s.onload=function(){GDrive.ready=true;render();};
  document.head.appendChild(s);
}

function gSignIn(){
  if(!GDrive.ready){showToast('Google not loaded yet');return;}
  var client=google.accounts.oauth2.initTokenClient({
    client_id:GAPI_CLIENT_ID,
    scope:GAPI_SCOPE,
    callback:function(resp){
      if(resp.error){showToast('Sign in failed: '+resp.error);return;}
      GDrive.token=resp.access_token;
      GDrive.status='signed-in';
      showToast('Signed in to Google — auto-saving every 2 min');
      resetAutoSave();
      render();
    }
  });
  client.requestAccessToken();
}

function gSignOut(){GDrive.token=null;GDrive.fileId=null;GDrive.status='';showToast('Signed out of Google');render();}

function gAuth(fn){
  if(GDrive.token){fn();return;}
  gSignIn();
}

function gFindFile(cb){
  fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%22'+GAPI_FILE_NAME+'%22&fields=files(id)',{
    headers:{Authorization:'Bearer '+GDrive.token}
  }).then(function(r){return r.json();}).then(function(d){
    GDrive.fileId=(d.files&&d.files[0])?d.files[0].id:null;
    cb(GDrive.fileId);
  }).catch(function(){cb(null);});
}

function gSave(silent){
  if(!GDrive.token){gSignIn();return;}
  if(!silent){GDrive.status='saving';render();}
  var data=JSON.stringify({jobs:S.jobs,exportedAt:new Date().toISOString()},null,2);
  gFindFile(function(fileId){
    if(fileId){
      gUpload(fileId,data,silent);
    } else {
      var meta=JSON.stringify({name:GAPI_FILE_NAME,parents:['appDataFolder']});
      fetch('https://www.googleapis.com/drive/v3/files',{
        method:'POST',headers:{Authorization:'Bearer '+GDrive.token,'Content-Type':'application/json'},body:meta
      }).then(function(r){return r.json();}).then(function(f){
        GDrive.fileId=f.id;
        gUpload(f.id,data,silent);
      });
      return;
    }
  });
}

function gUpload(fileId,data,silent){
  fetch('https://www.googleapis.com/upload/drive/v3/files/'+fileId+'?uploadType=media',{
    method:'PATCH',
    headers:{Authorization:'Bearer '+GDrive.token,'Content-Type':'application/json'},
    body:data
  }).then(function(r){
    if(r.ok){
      GDrive.status='saved';
      if(!silent){showToast('✓ Saved to Google Drive');render();}
      setTimeout(function(){GDrive.status='signed-in';if(!silent)render();},3000);
    } else {
      GDrive.status='signed-in';
      if(!silent)showToast('Save failed — try again');
    }
  });
}

function gLoad2(){
  if(!GDrive.token){gSignIn();return;}
  GDrive.status='loading';render();
  gFindFile(function(fileId){
    if(!fileId){GDrive.status='signed-in';showToast('No saved jobs found in Drive');render();return;}
    fetch('https://www.googleapis.com/drive/v3/files/'+fileId+'?alt=media',{
      headers:{Authorization:'Bearer '+GDrive.token}
    }).then(function(r){return r.json();}).then(function(d){
      if(!d.jobs||!Array.isArray(d.jobs)){showToast('Could not read Drive file');return;}
      var ids=new Set(S.jobs.map(function(j){return j.id;}));
      d.jobs.forEach(function(j){
        if(ids.has(j.id)){S.jobs[S.jobs.findIndex(function(x){return x.id===j.id;})]=j;}
        else{S.jobs.unshift(j);}
      });
      sortJobs();save();GDrive.status='signed-in';showToast('✓ Loaded '+d.jobs.length+' job(s) from Drive');render();
    }).catch(function(){GDrive.status='signed-in';showToast('Load failed — try again');render();});
  });
}

var S={jobs:[],activeJobId:null,activeRoomId:null,view:'list',toast:'',showNJ:false,showNR:false,njName:'',nrName:'',listScrollY:0,search:''};

gLoadGAPI();

function sortJobs(){S.jobs.sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt)||(b.id>a.id?1:-1);});}

function load(){try{var r=localStorage.getItem(SK);if(r){var p=JSON.parse(r);S.jobs=p.jobs||[];S.jobs.forEach(function(j){j.rooms.forEach(function(r){migRoom(r);});});sortJobs();}}catch(e){}}
function save(){try{localStorage.setItem(SK,JSON.stringify({jobs:S.jobs}));}catch(e){}}

// Auto-save to Drive every 2 minutes when signed in
var gAutoSaveTimer=null;
function resetAutoSave(){
  if(gAutoSaveTimer)clearTimeout(gAutoSaveTimer);
  gAutoSaveTimer=setTimeout(function(){
    if(GDrive.token&&S.jobs.length>0){
      gSave(true); // silent=true, no toast
    }
    resetAutoSave();
  },2*60*1000);
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function aJob(){return S.jobs.find(function(j){return j.id===S.activeJobId;})||null;}
function aRoom(){var j=aJob();if(!j)return null;var r=j.rooms.find(function(r){return r.id===S.activeRoomId;})||null;return r?migRoom(r):null;}
function nJob(n){return{id:uid(),name:n,createdAt:new Date().toLocaleDateString(),rooms:[],jobMarkup:0,outOfTown:false,otDays:'',otCrew:'',otMiles:'',status:'',jobTotalOverride:'',travelOverride:''};}
function nPaper(){return{id:uid(),paperTypeIdx:0,paperWidth:'',rollFt:'',vRepeat:'',halfDrop:false,paperLabel:'',material:'',heMultiplier:'',pattern:'random',yardMin:'',yardIncrement:'',yardRollMax:'',wallWidth:'',wallHeight:'',openings:[]};}
function nRoom(n){return{id:uid(),name:n,notes:'',roomNotes:'',industry:'residential',spaceType:'bedroom',accentWallCount:1,wainscotDiscount:0,coverageDiscount:0,ceilingHeight:8,ceilingPitch:'straight',paperedHeight:'',multiPaper:false,laborOverride:'',markup:0,papers:[nPaper()],material:'nonwoven',heMultiplier:'1.3',pattern:'random',panelBalancing:false,handTrimmed:false,difficulty:1.0,ladder:'standard',drywall:false,drywallSqft:'',drywallPriceSqft:'',lining:false,liningPrice:'',outlets:'',vents:'',useSegments:false,segments:[nSeg()],openings:[],hasCeiling:false,ceiling:{direction:'length',sections:[nCS()]},vaulted:false,vaultType:'symmetric',vaultWidth:'',vaultHeightLeft:'',vaultHeightPeak:'',vaultHeightRight:'',vaultPeakPos:''};}
function migRoom(r){
  // Migrate old format (flat paperWidth/rollFt etc) to papers array
  if(!r.papers){
    var p=nPaper();
    p.paperTypeIdx=r.paperTypeIdx||0;p.paperWidth=r.paperWidth||'';p.rollFt=r.rollFt||'';
    p.vRepeat=r.vRepeat||'';p.halfDrop=r.halfDrop||false;p.paperLabel=r.paperLabel||'';
    r.papers=[p];
    if(r.altPaper){var p2=Object.assign(nPaper(),r.altPaper);r.papers.push(p2);}
    // carry room-level pattern into first paper
    if(r.pattern&&!p.pattern)p.pattern=r.pattern;
    delete r.paperTypeIdx;delete r.paperWidth;delete r.rollFt;delete r.vRepeat;
    delete r.halfDrop;delete r.paperLabel;delete r.altPaper;
  }
  // Auto-enable multiPaper if papers already have wall measurements
  if(r.multiPaper===undefined||r.multiPaper===null){
    r.multiPaper=!!(r.papers&&r.papers.some(function(p){return parseFloat(p.wallWidth)>0||parseFloat(p.wallHeight)>0;}));
  }
  return r;
}function nSeg(){return{id:uid(),label:'',width:'',height:'',laborHeight:'',openings:[],vaulted:false,vaultType:'pitch',vaultHeightHigh:'',vaultHeightLow:'',vaultHeightPeak:'',vaultPeakPos:''};}
function nOp(){return{id:uid(),type:'Door',width:'',above:'',below:'',wrapLeft:false,wrapRight:false,wrapTop:false,wrapBottom:false,revealDepth:''};}
function nCS(){return{id:uid(),length:'',width:''};}

function sL(hFt,vrIn){if(!vrIn||vrIn<=0)return hFt+0.5;var v=vrIn/12;return Math.ceil(hFt/v)*v;}
function balW(wIn,pw){
  var f=Math.floor(wIn/pw),r=wIn%pw,h=pw/2,t=f+1,s=(wIn-pw)/2,e=wIn/t;
  if(r===0)return{strips:f,desc:f+' full strips'};
  if(s>=h)return{strips:t,desc:pw+'in center + '+s.toFixed(1)+'in each side'};
  return{strips:t,desc:t+' strips at ~'+e.toFixed(1)+'in each'};
}

function calcPForPaper(room, paper){
  if(room.vaulted&&parseFloat(room.vaultWidth)>0&&parseFloat(room.vaultHeightPeak)>0){
    return calcPVaulted(room, paper);
  }
  // Ceiling space type — build a ceiling structure from segments and route through calcC
  if(room.spaceType==='ceiling'&&room.segments&&room.segments.length>0){
    var ceilRoom=Object.assign({},room,{
      hasCeiling:true,
      material:paper.material||room.material||'nonwoven',
      pattern:paper.pattern||room.paper||'random',
      papers:[paper],
      ceiling:{
        direction:'length',
        sections:room.segments.map(function(seg){return{id:seg.id,length:seg.width,width:seg.height};})
      }
    });
    var cResult=calcC(ceilRoom);
    if(!cResult)return null;
    return{totalStrips:cResult.totalStrips,totalLF:cResult.totalLF,rolls:cResult.rolls,rf:cResult.rf,halfDropNote:null};
  }
  var hasPaperMeas=room.multiPaper&&parseFloat(paper.wallWidth)>0&&parseFloat(paper.wallHeight)>0;
  var merged=Object.assign({},room,{
    papers:null,
    paperWidth:paper.paperWidth,
    rollFt:paper.soldByYard?'999':paper.rollFt,
    vRepeat:paper.vRepeat,
    halfDrop:paper.halfDrop,
    paperedHeight:room.paperedHeight
  });
  if(hasPaperMeas){
    // Override segments with paper's own measurements
    merged.useSegments=false;
    merged.segments=[{id:'pp',label:'',width:paper.wallWidth,height:paper.wallHeight,laborHeight:'',openings:[]}];
    merged.openings=paper.openings||[];
  }
  var result=calcP(merged);
  if(result&&paper.soldByYard){
    var avgStripFt=result.totalStrips>0?result.totalLF/result.totalStrips:0;
    var totalWithBuffer=result.totalLF+avgStripFt;
    var yardsNeeded=totalWithBuffer/3;
    var min=parseFloat(paper.yardMin)||0;
    var inc=parseFloat(paper.yardIncrement)||0;
    var yardsToOrder;
    if(min>0&&yardsNeeded<=min){yardsToOrder=min;}
    else if(min>0&&inc>0){yardsToOrder=min+Math.ceil((yardsNeeded-min)/inc)*inc;}
    else if(inc>0){yardsToOrder=Math.ceil(yardsNeeded/inc)*inc;}
    else{yardsToOrder=Math.ceil(yardsNeeded);}
    result.soldByYard=true;result.yardsNeeded=yardsNeeded;result.yardMin=min;
    result.yardIncrement=inc;result.yardsToOrder=yardsToOrder;
    var rollMax=parseFloat(paper.yardRollMax)||0;
    result.yardRollMax=rollMax;result.yardRolls=rollMax>0?Math.ceil(yardsToOrder/rollMax):null;
  }
  return result;
}

function calcP(room){
  var p0=room.papers&&room.papers[0]?room.papers[0]:{paperWidth:room.paperWidth,rollFt:room.rollFt,vRepeat:room.vRepeat,halfDrop:room.halfDrop};
  var pw=parseFloat(p0.paperWidth)||0,rf=parseFloat(p0.rollFt)||0,vr=parseFloat(p0.vRepeat)||0;
  var ph=parseFloat(room.paperedHeight)||0;
  if(!pw||!rf)return null;
  var pwF=pw/12,isB=room.panelBalancing,isMultiA=room.spaceType==='accent_wall'&&(parseInt(room.accentWallCount)||1)>1,useS=room.useSegments||isB||isMultiA;
  var lf=0,strips=0;
  if(useS){
    room.segments.forEach(function(seg){
      var wFt=parseFloat(seg.width)||0,hFt=parseFloat(seg.height)||0;
      if(!wFt)return;
      // Per-segment vaulted wall
      if(seg.vaulted&&(parseFloat(seg.vaultHeightHigh)||0)>0){
        var wIn=wFt*12; // convert to inches for vault calc
        var hH=parseFloat(seg.vaultHeightHigh)||0;
        var hL=parseFloat(seg.vaultHeightLow)||0;
        var hP=parseFloat(seg.vaultHeightPeak)||0;
        var vt=seg.vaultType||'pitch';
        var peakPosIn;
        if(vt==='pitch'){hP=hH;peakPosIn=0;}
        else if(vt==='symmetric'){peakPosIn=wIn/2;if(!hL)hL=hH;}
        else{peakPosIn=parseFloat(seg.vaultPeakPos)||wIn/2;}
        var nStrips=Math.ceil(wFt/pwF);
        for(var si=0;si<nStrips;si++){
          var cx=(si+0.5)*(wIn/nStrips);
          var ht;
          if(cx<=peakPosIn){ht=hH+(hP-hH)*(cx/peakPosIn);}
          else{ht=hP+(hL-hP)*((cx-peakPosIn)/(wIn-peakPosIn));}
          ht=ht/12;
          var slen=vr>0?sL(ht,vr):ht+0.5;
          lf+=slen;
        }
        strips+=nStrips;
        return;
      }
      var stripHFt=ph>0?ph/12:hFt;
      if(!hFt)return;
      if(isB){var b=balW(wFt,pw);strips+=b.strips;lf+=b.strips*sL(stripHFt,0);}
      else{
        var ms=Math.ceil(wFt/pwF),segLF=ms*sL(stripHFt,vr),dl=0,al=0,ds=0;
        (seg.openings||[]).forEach(function(op){
          var ow=parseFloat(op.width)||0,ab=parseFloat(op.above)||0,be=parseFloat(op.below)||0;
          var owIn=ow,sf=Math.floor((owIn-2-pw)/pw);
          if(sf<1)return;
          ds+=sf;dl+=sf*sL(stripHFt,vr);
          if(ab>0)al+=sf*sL(ab/12,vr);
          if(be>0)al+=sf*sL(be/12,vr);
          if(ab>0||be>0)ds-=sf;
        });
        strips+=Math.max(0,ms-ds);lf+=Math.max(0,segLF-dl+al);
      }
    });
  } else {
    var seg0=room.segments[0]||{};
    var w=parseFloat(seg0.width)||0,h=parseFloat(seg0.height)||0;
    var stripH=ph>0?ph/12:h;
    if(!w||!h)return null;
    var s=Math.ceil(w/pwF);strips=s;
    var g=s*sL(stripH,vr),dl=0,al=0,ds=0;
    room.openings.forEach(function(op){
      var ow=parseFloat(op.width)||0,ab=parseFloat(op.above)||0,be=parseFloat(op.below)||0;
      var owIn=ow,sf=Math.floor((owIn-2-pw)/pw);
      if(sf<1)return;
      ds+=sf;dl+=sf*sL(stripH,vr);
      if(ab>0)al+=sf*sL(ab/12,vr);
      if(be>0)al+=sf*sL(be/12,vr);
      // strips are deducted (no full strip needed) but partial strips above/below still count
      if(ab>0||be>0)ds-=sf; // add them back — they still need a strip cut
    });
    lf=Math.max(0,g-dl+al);strips=Math.max(0,s-ds);
  }
  var hdN=null;
  if(p0.halfDrop&&vr>0){
    var buf=vr/12,bLF=lf+buf,rW=Math.ceil(bLF/rf),rO=Math.ceil(lf/rf);
    if(rW>rO)hdN='Half drop buffer ('+vr+'in repeat) would need '+rW+' rolls. Keeping at '+rO+'.';
    else lf=bLF;
  }
  var rolls;
  if(useS&&room.segments&&room.segments.length>1){
    // Multiple segments with different heights — greedy pack by actual strip lengths
    var allStripLens=[];
    room.segments.forEach(function(seg){
      var wIn=parseFloat(seg.width)||0,hFt=parseFloat(seg.height)||0;
      var stripHFt=ph>0?ph/12:hFt;
      if(!wIn||!hFt)return;
      var ns=Math.ceil(wIn/pwF); // both in feet
      var slen=vr>0?sL(stripHFt,vr):stripHFt+0.5;
      for(var i=0;i<ns;i++)allStripLens.push(slen);
    });
    allStripLens.sort(function(a,b){return b-a;});
    rolls=0;var rem=0;
    allStripLens.forEach(function(len){
      if(rem<len){rolls++;rem=rf;}
      rem-=len;
    });
  } else {
    var maxStripFt=0;
    if(ph>0){
      maxStripFt=ph/12;
    } else {
      (useS?room.segments:[room.segments[0]||{}]).forEach(function(seg){
        var h=parseFloat(seg.height)||0;if(h>maxStripFt)maxStripFt=h;
      });
    }
    var longestStrip=vr>0?sL(maxStripFt,vr):maxStripFt+0.5;
    var stripsPerRoll=longestStrip>0?Math.floor(rf/longestStrip):1;
    rolls=stripsPerRoll>0?Math.ceil(strips/stripsPerRoll):Math.ceil(lf/rf);
  }
  // Add extra strips for window return wraps
  var allOpsWrap=[];
  if(useS){room.segments.forEach(function(seg){(seg.openings||[]).forEach(function(op){allOpsWrap.push(op);});});}
  else{allOpsWrap=room.openings||[];}
  allOpsWrap.forEach(function(op){
    var hasWrap=op.wrapLeft||op.wrapRight||op.wrapTop||op.wrapBottom||op.wrapReturns;
    if(!hasWrap)return;
    var ab=parseFloat(op.above)||0, be=parseFloat(op.below)||0, rv=parseFloat(op.revealDepth)||0;
    var neededIn=(ab+rv)+(be+rv);
    var neededFt=neededIn/12;
    var fullStripFt=ph>0?ph/12:(parseFloat((room.segments[0]||{}).height)||8);
    var fullStripRounded=vr>0?sL(fullStripFt,vr):fullStripFt+0.5;
    var wrapStripRounded=vr>0?sL(neededFt,vr):neededFt+0.5;
    var repeatLen=vr>0?vr/12:0;
    var useShort=repeatLen>0&&(fullStripRounded-wrapStripRounded)>=(2*repeatLen);
    var wrapLen=useShort?wrapStripRounded:fullStripRounded;
    var wrapSides=(op.wrapLeft?1:0)+(op.wrapRight?1:0)+(op.wrapReturns?2:0);
    lf+=wrapSides*wrapLen;
    strips+=wrapSides;
  });
  return{totalStrips:strips,totalLF:lf,rolls:rolls,rf:rf,halfDropNote:hdN};
}

function calcLForPaper(room, paper){
  var mat=paper.material||(room.material||'nonwoven');
  var hasPaperMeas=room.multiPaper&&parseFloat(paper.wallWidth)>0&&parseFloat(paper.wallHeight)>0;
  var merged=Object.assign({},room,{material:mat,heMultiplier:paper.heMultiplier||room.heMultiplier,pattern:paper.pattern||room.pattern||'random'});
  if(hasPaperMeas){
    merged.useSegments=false;
    merged.segments=[{id:'pp',label:'',width:paper.wallWidth,height:paper.wallHeight,laborHeight:'',openings:[]}];
    merged.openings=paper.openings||[];
  }
  return calcL(merged);
}

function calcPVaulted(room, paper){
  var pw=parseFloat(paper.paperWidth)||0, rf=parseFloat(paper.rollFt)||0, vr=parseFloat(paper.vRepeat)||0;
  if(!pw||!rf)return null;
  var totalW=parseFloat(room.vaultWidth)||0;
  var hL=parseFloat(room.vaultHeightLeft)||0;
  var hR=parseFloat(room.vaultHeightRight)||0;
  var hP=parseFloat(room.vaultHeightPeak)||0;
  var vaultType=room.vaultType||'symmetric';
  var peakPos;
  if(vaultType==='pitch'){
    // Straight pitch: high side is left, low side is right, no separate peak
    hP=hL; peakPos=0;
    if(!hR)hR=hL;
  } else if(vaultType==='asymmetric'){
    peakPos=parseFloat(room.vaultPeakPos)||totalW/2;
  } else {
    // symmetric: peak in center
    peakPos=totalW/2;
    if(!hR)hR=hL;
  }
  if(!totalW||!hL||(vaultType!=='pitch'&&!hP))return null;

  var pwF=pw/12;
  var nStrips=Math.ceil((totalW/12)/pwF);
  var stripLengths=[];
  var maxStripFt=0;

  for(var i=0;i<nStrips;i++){
    var cx=(i+0.5)*(totalW/nStrips);
    var hFt;
    if(cx<=peakPos){
      hFt=hL+(hP-hL)*(cx/peakPos);
    } else {
      hFt=hP+(hR-hP)*((cx-peakPos)/(totalW-peakPos));
    }
    hFt=hFt/12;
    var stripLen=vr>0?sL(hFt,vr):hFt+0.5;
    if(stripLen>maxStripFt)maxStripFt=stripLen;
    stripLengths.push(stripLen);
  }

  var totalLF=stripLengths.reduce(function(s,l){return s+l;},0);

  // Pack strips into rolls greedily — sort descending, fill each roll
  var sorted=stripLengths.slice().sort(function(a,b){return b-a;});
  var rolls=0, remaining=0;
  sorted.forEach(function(len){
    if(remaining<len){rolls++;remaining=rf;}
    remaining-=len;
  });

  return{totalStrips:nStrips,totalLF:totalLF,rolls:rolls,rf:rf,halfDropNote:null,vaulted:true,maxStripFt:maxStripFt};
}

function calcC(room){
  if(!room.hasCeiling)return null;
  var p0=room.papers&&room.papers[0]?room.papers[0]:{paperWidth:room.paperWidth,rollFt:room.rollFt,vRepeat:room.vRepeat};
  var pw=parseFloat(p0.paperWidth)||0,rf=parseFloat(p0.rollFt)||0,vr=parseFloat(p0.vRepeat)||0;
  if(!pw||!rf)return null;
  var pwF=pw/12,lf=0,strips=0;
  var CEIL_TRIM=4/12; // 2" each end
  room.ceiling.sections.forEach(function(sec){
    var l=parseFloat(sec.length)||0,w=parseFloat(sec.width)||0;
    if(!l||!w)return;
    var sp=room.ceiling.direction==='length'?w:l,rn=room.ceiling.direction==='length'?l:w;
    var s=Math.ceil(sp/pwF);strips+=s;
    // For ceilings: use 4in trim buffer; sL handles repeat rounding when repeat>0
    var stripLen=vr>0?sL(rn+CEIL_TRIM,vr):rn+CEIL_TRIM;
    lf+=s*stripLen;
  });
  if(!lf)return null;
  var ceilMat=p0.material||room.material||'nonwoven';
  var ceilPat=p0.pattern||room.pattern||'random';
  var isHighEnd=!!MATS_H.find(function(m){return m.v===ceilMat;});
  var base=ceilMat==='natural'?BASE_N:isHighEnd?BASE_H:BASE_R;
  var ch=CH_M[room.ceilingHeight]||1,pi=PITCH[room.ceilingPitch]||1;
  var matObj=MATS_R.find(function(m){return m.v===ceilMat;})||MATS_H.find(function(m){return m.v===ceilMat;});
  var mat=matObj?(matObj.adj?parseFloat(p0.heMultiplier||room.heMultiplier)||1.3:matObj.m):1;
  var patObj=PATS.find(function(p){return p.v===ceilPat;});
  var pat=patObj?patObj.m:1;
  var diff=room.difficulty||1;
  var lad=LADS.find(function(l){return l.v===room.ladder;})||LADS[0];
  var ceilSqft=room.ceiling.sections.reduce(function(s,sec){return s+(parseFloat(sec.length)||0)*(parseFloat(sec.width)||0);},0);
  var ceilInstall=Math.max(INSTALL_MIN,Math.round(ceilSqft*base*2.0*ch*pi*mat*pat*diff*lad.m+ceilSqft*PRIMER));
  var rolls;
  if(strips>0&&lf>0){
    var avgStripLF=lf/strips;
    var stripsPerRoll=Math.max(1,Math.floor(rf/avgStripLF));
    rolls=Math.ceil(strips/stripsPerRoll);
  } else {
    rolls=Math.ceil(lf/rf);
  }
  return{totalStrips:strips,totalLF:lf,rolls:rolls,rf:rf,ceilSqft:ceilSqft,ceilInstall:ceilInstall};
}

function calcL(room){
  var isB=room.panelBalancing,isMultiA=room.spaceType==='accent_wall'&&(parseInt(room.accentWallCount)||1)>1,useS=room.useSegments||isB||isMultiA;
  var wd=parseFloat(room.wainscotDiscount)||0;
  var sqft=0;
  if(room.vaulted&&parseFloat(room.vaultWidth)>0){
    var vW=parseFloat(room.vaultWidth)/12;
    var vHL=parseFloat(room.vaultHeightLeft)||0;
    var vHR=parseFloat(room.vaultHeightRight)||vHL;
    var vHP=parseFloat(room.vaultHeightPeak)||vHL;
    var vt=room.vaultType||'symmetric';
    var avgH;
    if(vt==='pitch'){avgH=(vHL+vHR)/2/12;}
    else{avgH=((vHL+vHR)/2+vHP)/2/12;}
    sqft=vW*avgH;
  } else if(useS){
    room.segments.forEach(function(seg){
      var w=isB?(parseFloat(seg.width)||0)/12:(parseFloat(seg.width)||0);
      if(seg.vaulted&&(parseFloat(seg.vaultHeightHigh)||0)>0){
        var hH=parseFloat(seg.vaultHeightHigh)||0;
        var hL=parseFloat(seg.vaultHeightLow)||hH;
        var hP=parseFloat(seg.vaultHeightPeak)||hH;
        var vt=seg.vaultType||'pitch';
        var avgH=vt==='pitch'?(hH+hL)/2/12:((hH+hL)/2+hP)/2/12;
        if(w)sqft+=w*avgH;
      } else {
        var h=parseFloat(seg.height)||0;
        var lh=wd>0?(parseFloat(seg.laborHeight)||h):h;
        if(w&&lh)sqft+=w*lh;
      }
    });
  } else {
    var seg0=room.segments[0]||{};
    sqft=(parseFloat(seg0.width)||0)*(parseFloat(seg0.height)||0);
  }
  if(!sqft)return null;
  var matObj=MATS_R.find(function(m){return m.v===room.material;})||MATS_H.find(function(m){return m.v===room.material;});
  var isHighEnd=!!MATS_H.find(function(m){return m.v===room.material;});
  var base=room.material==='natural'?BASE_N:isHighEnd?BASE_H:BASE_R;
  var mat=matObj?(matObj.adj?parseFloat(room.heMultiplier)||1.3:matObj.m):1;
  var spObj=SPACES.find(function(s){return s.v===room.spaceType;})||SPACES[0];
  var ch=wd>0?1:(CH_M[room.ceilingHeight]||1);
  var pi=PITCH[room.ceilingPitch]||1;
  var patObj=PATS.find(function(p){return p.v===room.pattern;});
  var pat=patObj?patObj.m:1;
  var diff=room.difficulty||1,bm=room.panelBalancing?1.175:1,tm=room.handTrimmed?1.15:1;
  var lad=LADS.find(function(l){return l.v===room.ladder;})||LADS[0];
  var lb=sqft*base*spObj.m*ch*pi*mat*pat*diff*bm*tm*lad.m;
  if(wd>0)lb*=(1-wd);
  var cd=parseFloat(room.coverageDiscount)||0;
  if(cd>0)lb*=(1-cd);
  var pr=sqft*PRIMER;
  var awCount=(room.spaceType==='accent_wall')?Math.max(1,parseInt(room.accentWallCount)||1):1;
  var heUpcharge=room.material==='natural'?sqft*1.00:room.material==='highend'?sqft*1.50:0;
  var baseMin;
  if(room.spaceType==='powder_bath'&&wd===0)baseMin=POWDER_MIN;
  else if(room.spaceType==='accent_wall')baseMin=awCount===1?ACCENT_MIN:ACCENT_MIN_EACH*awCount;
  else baseMin=INSTALL_MIN;
  var wallMin=Math.round((baseMin+heUpcharge)*diff*bm*tm*(1-(wd||0))*(1-(cd||0)));
  var otm=room.outOfTown?1.1:1;
  var wallInstall=Math.max(Math.round(wallMin*otm),Math.round((lb+pr)*otm));
  var dw=0;
  if(room.drywall){var ds=parseFloat(room.drywallSqft)||0,dp=parseFloat(room.drywallPriceSqft)||0;dw=Math.max(300,ds*dp);}
  var li=0;
  if(room.lining){
    var liningOverride=parseFloat(room.liningPrice)||0;
    if(liningOverride>0){
      li=liningOverride;
    } else {
      li=Math.round(wallInstall*0.5*diff);
    }
    li=Math.max(300,li);
  }
  var outletCost=(parseFloat(room.outlets)||0)*10;
  var ventCost=(parseFloat(room.vents)||0)*25;
  // Wrap return labor: $5/lf × perimeter of wrapped openings
  var wrapLaborCost=0;
  var allOpsForWrap=[];
  if(room.useSegments||room.panelBalancing){room.segments.forEach(function(seg){(seg.openings||[]).forEach(function(op){allOpsForWrap.push(op);});});}
  else{allOpsForWrap=room.openings||[];}
  allOpsForWrap.forEach(function(op){
    var wFt=parseFloat(op.width)/12||0;
    var wallH=(parseFloat((room.segments[0]||{}).height)||parseFloat(room.vaultHeightPeak)/12||8);
    var ab=parseFloat(op.above)||0, be=parseFloat(op.below)||0;
    var sideHFt=Math.max(0, wallH - (ab+be)/12); // window height in feet
    var leftRight=((op.wrapLeft?1:0)+(op.wrapRight?1:0)+(op.wrapReturns?2:0))*sideHFt*5;
    var topBottom=((op.wrapTop?1:0)+(op.wrapBottom?1:0))*wFt*10;
    wrapLaborCost+=leftRight+topBottom;
  });
  wrapLaborCost=Math.round(wrapLaborCost);
  return{grossSqft:sqft,wallInstall:wallInstall,wallMin:wallMin,drywallCost:dw,liningCost:li,ladderFlat:lad.flat,wainscotDiscount:wd,coverageDiscount:cd,accentWallCount:awCount,outletCost:outletCost,ventCost:ventCost,wrapLaborCost:wrapLaborCost};
}

function roomTotal(lR,cR,room){
  var laborOverride=room&&parseFloat(room.laborOverride)>0?parseFloat(room.laborOverride):0;
  if(!lR){
    // No calc result — return override with markup if set, otherwise 0
    if(laborOverride>0){var mu0=parseFloat(room&&room.markup)||0;return mu0>0?Math.round(laborOverride*(1+mu0)):laborOverride;}
    return 0;
  }
  var mu=parseFloat(room&&room.markup)||0;
  var subtotal;
  if(room&&room.papers&&room.multiPaper&&room.papers.some(function(p){return parseFloat(p.wallWidth)>0&&parseFloat(p.wallHeight)>0;})){
    if(laborOverride>0){
      subtotal=laborOverride+(cR?cR.ceilInstall:0)+lR.ladderFlat+lR.drywallCost+lR.liningCost+(lR.outletCost||0)+(lR.ventCost||0)+(lR.wrapLaborCost||0);
    } else {
      var total=0;
      room.papers.forEach(function(paper){var lRx=calcLForPaper(room,paper);if(lRx)total+=lRx.wallInstall+lRx.ladderFlat+lRx.drywallCost+lRx.liningCost+(lRx.outletCost||0)+(lRx.ventCost||0)+(lRx.wrapLaborCost||0);});
      subtotal=total+(cR?cR.ceilInstall:0);
    }
  } else {
    var wallInstall=laborOverride>0?laborOverride:lR.wallInstall;
    subtotal=wallInstall+(cR?cR.ceilInstall:0)+lR.ladderFlat+lR.drywallCost+lR.liningCost+(lR.outletCost||0)+(lR.ventCost||0)+(lR.wrapLaborCost||0);
  }
  return mu>0?Math.round(subtotal*(1+mu)):subtotal;
}

function showToast(msg){S.toast=msg;render();setTimeout(function(){S.toast='';render();},3000);}
function dl(d,n){var b=new Blob([d],{type:'application/json'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download=n;a.click();URL.revokeObjectURL(u);}
function expAll(){dl(JSON.stringify({jobs:S.jobs,exportedAt:new Date().toISOString()},null,2),'wallpaper-jobs-'+new Date().toISOString().slice(0,10)+'.json');showToast('All jobs exported');}
function expJob(job){dl(JSON.stringify({jobs:[job],exportedAt:new Date().toISOString()},null,2),job.name.replace(/[^a-z0-9]/gi,'-').toLowerCase()+'-'+new Date().toISOString().slice(0,10)+'.json');showToast('Job exported');}
function impJobs(file){
  var r=new FileReader();
  r.onload=function(e){
    try{
      var d=JSON.parse(e.target.result);
      if(!d.jobs||!Array.isArray(d.jobs))throw 0;
      var ids=new Set(S.jobs.map(function(j){return j.id;}));
      d.jobs.forEach(function(j){
        if(ids.has(j.id)){S.jobs[S.jobs.findIndex(function(x){return x.id===j.id;})]=j;}
        else{S.jobs.unshift(j);}
      });
      sortJobs();save();showToast('Imported '+d.jobs.length+' job(s)');render();
    }catch(e){showToast('Could not read file');}
  };
  r.readAsText(file);
}

function dClass(r,v){return Math.abs((r.difficulty||1.0)-v)<0.001?'diff-btn diff-btn-on':'diff-btn';}
function wClass(r,v){return Math.abs((parseFloat(r.wainscotDiscount)||0)-v)<0.001?'diff-btn diff-btn-on':'diff-btn';}
function cClass(r,v){return Math.abs((parseFloat(r.coverageDiscount)||0)-v)<0.001?'diff-btn diff-btn-on':'diff-btn';}

  }
  h+='<button onclick="document.getElementById(\'import-file\').click()">Import</button>';

  h+='<button class="btn-primary" id="bnj">+ New job</button>';

  h+='<input id="job-search" value="'+(S.search||'')+'" placeholder="🔍 Search jobs..." style="width:240px;font-size:13px;padding:6px 10px;border:1px solid #d0d0d0;border-radius:8px;background:#fff;outline:none">';
  if(S.search)h+='<button onclick="S.search=\'\';render();" style="font-size:12px;color:#888;border:none;background:none;cursor:pointer">&times; Clear</button>';
  h+='</div>';
  if(S.showNJ){
    h+='<div class="inline-form"><input id="njn" placeholder="Customer / job name" value="'+S.njName+'">';
    h+='<button class="btn-primary" id="bcj">Create</button>';
    h+='<button id="bcnj" style="border:none;background:none;cursor:pointer;font-size:18px;color:#999">&times;</button></div>';
  }
  var filteredJobs=S.search?S.jobs.filter(function(j){return j.name.toLowerCase().indexOf(S.search.toLowerCase())>-1;}):S.jobs;
  if(filteredJobs.length===0&&!S.showNJ){
    h+='<div class="card" style="text-align:center;padding:3rem;color:#aaa"><p style="font-size:16px;margin-bottom:8px">'+(S.search?'No jobs match "'+S.search+'"':'No jobs yet')+'</p>'+(S.search?'':'<p style="font-size:13px">Click + New job to get started</p>')+'</div>';
  }
  filteredJobs.forEach(function(j){
    var tr=j.rooms.reduce(function(s,r){
    var p=calcP(r);var c=calcC(r);
    var wallRolls=p?p.rolls:0;
    var ceilRolls=0;
    if(c){
      if(p&&p.rf===c.rf){
        var vr=parseFloat((r.papers&&r.papers[0]?r.papers[0]:r).vRepeat)||0,vrFt=vr/12,trimFt=4/12;
        var avgCeilStrip=c.totalStrips>0?c.totalLF/c.totalStrips:0;
        var minPerStrip=avgCeilStrip+trimFt+(vr>0?2*vrFt:0);
        var leftoverPerRoll=wallRolls>0?((wallRolls*p.rf)-p.totalLF)/wallRolls:0;
        var stripsFromLeftover=minPerStrip>0?Math.floor(leftoverPerRoll/minPerStrip)*wallRolls:0;
        var stripsStillNeeded=Math.max(0,c.totalStrips-stripsFromLeftover);
        var spr=avgCeilStrip>0?Math.max(1,Math.floor(c.rf/avgCeilStrip)):1;
        ceilRolls=stripsStillNeeded>0?Math.ceil(stripsStillNeeded/spr):0;
      } else {ceilRolls=c.rolls;}
    }
    return s+wallRolls+ceilRolls;
  },0);
    var tl=j.rooms.reduce(function(s,r){

        if(pRx.vaulted)h+='<div class="info-note" style="margin-top:4px">Vaulted wall — strips calculated individually along slope. Longest strip: '+pRx.maxStripFt.toFixed(2)+'ft</div>';
      });
    }
    if(cR){
      var ceilRollsNeeded=cR.rolls;
      var leftoverNote='';
      if(pR&&pR.rolls>0&&pR.rf===cR.rf){
        var vr=parseFloat((room.papers&&room.papers[0]?room.papers[0]:room).vRepeat)||0;
        var vrFt=vr/12;
        var trimFt=4/12; // 2" each end

        // Minimum footage needed to yield one usable ceiling strip:
        // strip length + 2" trim each end + 2 full repeats (one to find match, one buffer)
        // With no repeat, just strip length + trim
        var avgCeilStripFt=cR.totalStrips>0?cR.totalLF/cR.totalStrips:0;
        var minPerStrip=avgCeilStripFt+trimFt+(vr>0?2*vrFt:0);

        // How many usable ceiling strips can we pull from each wall roll's leftover?
        var wallRollLF=pR.rolls*pR.rf;
        var leftoverLF=wallRollLF-pR.totalLF;
        // Leftover is spread across all wall rolls — check per-roll leftover
        var leftoverPerRoll=leftoverLF/pR.rolls;
        var stripsPerRollFromLeftover=minPerStrip>0?Math.floor(leftoverPerRoll/minPerStrip):0;
        var totalStripsFromLeftover=stripsPerRollFromLeftover*pR.rolls;

        var stripsStillNeeded=Math.max(0,cR.totalStrips-totalStripsFromLeftover);
        // Convert remaining strips to rolls using same strips-per-roll logic as calcC
        var avgStripFt=cR.totalStrips>0?cR.totalLF/cR.totalStrips:0;
        var stripsPerFullRoll=avgStripFt>0?Math.max(1,Math.floor(cR.rf/avgStripFt)):1;
        ceilRollsNeeded=stripsStillNeeded>0?Math.ceil(stripsStillNeeded/stripsPerFullRoll):0;

        var coveredStrips=Math.min(totalStripsFromLeftover,cR.totalStrips);
        if(coveredStrips>0&&ceilRollsNeeded<cR.rolls){
          var repeatDesc=vr>0?'('+vr+'in repeat + 2" trim each end, '+minPerStrip.toFixed(2)+'ft min per strip)':'(no repeat, '+trimFt.toFixed(2)+'ft trim buffer)';
          if(ceilRollsNeeded===0){
            leftoverNote='<div class="info-note" style="margin-top:4px">&#10003; All '+cR.totalStrips+' ceiling strips covered by wall roll leftovers '+repeatDesc+'</div>';
          } else {
            leftoverNote='<div class="info-note" style="margin-top:4px">&#8594; '+coveredStrips+' of '+cR.totalStrips+' ceiling strips covered by wall leftovers '+repeatDesc+' — '+ceilRollsNeeded+' additional roll'+(ceilRollsNeeded!==1?'s':'')+' needed</div>';
          }
        } else if(vr>0&&stripsPerRollFromLeftover===0){
          leftoverNote='<div class="info-note" style="margin-top:4px;color:#b45309">&#9888; Repeat ('+vr+'in) too large — leftover per roll ('+leftoverPerRoll.toFixed(1)+'ft) not enough for even one ceiling strip (needs '+minPerStrip.toFixed(2)+'ft). Order full '+ceilRollsNeeded+' rolls.</div>';
        }
      }
      h+='<div style="font-size:12px;color:#888;margin-bottom:6px;font-weight:600;margin-top:10px">CEILING PAPER</div>';
      h+='<div class="grid4" style="margin-bottom:4px">';
      h+='<div class="metric"><div class="mlabel">Strips</div><div class="mval">'+cR.totalStrips+'</div></div>';
      h+='<div class="metric"><div class="mlabel">Paper linear ft</div><div class="mval">'+cR.totalLF.toFixed(1)+'</div></div>';
      h+='<div class="metric"><div class="mlabel">Rolls needed</div><div class="mval">'+ceilRollsNeeded+'</div><div class="msub">'+cR.rf+'ft rolls</div></div>';
      if(pR&&pR.rf!==cR.rf)h+='<div class="metric" style="grid-column:span 1"><div class="mlabel" style="color:#e08c00">&#9888; Roll length mismatch</div><div class="msub">Wall: '+pR.rf+'ft &middot; Ceiling: '+cR.rf+'ft</div></div>';
      h+='</div>';
      h+=leftoverNote;
      h+='</div>';
    } else {
      h+='</div>';
    }
    if(lR){
      var multi=room.papers.length>1;
      var hasPaperMeas=room.multiPaper&&room.papers.some(function(p){return parseFloat(p.wallWidth)>0&&parseFloat(p.wallHeight)>0;});
      var borderColors=['#e0e0e0','#bfdbfe','#bbf7d0','#fde68a','#f9a8d4'];
      var grandTotal=0;
      room.papers.forEach(function(paper,idx){
        var lRx=calcLForPaper(room,paper);
        if(!lRx)return;
        var letter=String.fromCharCode(65+idx);
        var label=paper.paperLabel?(' — '+paper.paperLabel):'';
        var paperTotal=lRx.wallInstall+lRx.ladderFlat+lRx.drywallCost+lRx.liningCost;
        grandTotal+=paperTotal;
        h+='<div style="font-size:12px;color:#888;margin-bottom:4px;font-weight:600;margin-top:10px;border-left:3px solid '+(borderColors[idx%borderColors.length])+';padding-left:8px">INSTALLATION'+(multi?' — Option '+letter+label:label)+'</div>';
        var wl='Wall installation ('+lRx.grossSqft.toFixed(0)+' sqft)';
        if(lRx.wainscotDiscount>0)wl+=' — '+Math.round(lRx.wainscotDiscount*100)+'% wainscot';
        if(lRx.coverageDiscount>0)wl+=' — '+Math.round(lRx.coverageDiscount*100)+'% coverage';
        var wb='';
        var isHEroom=!!MATS_H.find(function(m){return m.v===(paper.material||room.material);});
        var matLabel=(paper.material||room.material)==='natural'?'$1.00/sqft natural':'$1.50/sqft high-end';
        if(lRx.wallInstall===lRx.wallMin&&room.spaceType==='accent_wall'){
          wb='<span class="min-badge">('+lRx.accentWallCount+' wall min @ $'+ACCENT_MIN_EACH.toLocaleString()+' ea'+(isHEroom?' + '+matLabel:'')+')</span>';
        } else if(lRx.wallInstall===lRx.wallMin&&lRx.wallMin>INSTALL_MIN&&isHEroom){
          wb='<span class="min-badge">(min + '+matLabel+')</span>';
        } else if(lRx.wallInstall===lRx.wallMin){
          wb='<span class="min-badge">(min)</span>';
        }
        h+='<div class="price-row"><span class="price-label">'+wl+'</span><span class="price-val">$'+lRx.wallInstall.toLocaleString()+wb+'</span></div>';
        if(lRx.ladderFlat>0)h+='<div class="price-row"><span class="price-label">Ladder / access</span><span class="price-val">$'+lRx.ladderFlat+'</span></div>';
        if(lRx.drywallCost>0)h+='<div class="price-row"><span class="price-label">Drywall repair</span><span class="price-val">$'+Math.round(lRx.drywallCost).toLocaleString()+'</span></div>';
        if(lRx.liningCost>0)h+='<div class="price-row"><span class="price-label">Lining</span><span class="price-val">$'+Math.round(lRx.liningCost).toLocaleString()+'</span></div>';
        if(lRx.outletCost>0)h+='<div class="price-row"><span class="price-label">Outlets ('+room.outlets+' × $10)</span><span class="price-val">$'+lRx.outletCost+'</span></div>';
        if(lRx.ventCost>0)h+='<div class="price-row"><span class="price-label">Vents ('+room.vents+' × $25)</span><span class="price-val">$'+lRx.ventCost+'</span></div>';
        if(lRx.wrapLaborCost>0)h+='<div class="price-row"><span class="price-label">Return wraps</span><span class="price-val">$'+lRx.wrapLaborCost+'</span></div>';
        if(multi&&hasPaperMeas)h+='<div class="price-row" style="font-weight:600"><span class="price-label">Option '+letter+' subtotal</span><span class="price-val">$'+paperTotal.toLocaleString()+'</span></div>';
      });
      if(cR){var cb=cR.ceilInstall===INSTALL_MIN?'<span class="min-badge">(min)</span>':'';h+='<div class="price-row"><span class="price-label">Ceiling installation ('+cR.ceilSqft.toFixed(0)+' sqft)</span><span class="price-val">$'+cR.ceilInstall.toLocaleString()+cb+'</span></div>';grandTotal+=cR.ceilInstall;}
      var mu=parseFloat(room.markup)||0;
      var laborOverride=parseFloat(room.laborOverride)||0;
      var displayTotal=laborOverride>0?Math.round((laborOverride+(cR?cR.ceilInstall:0)+lR.ladderFlat+lR.drywallCost+lR.liningCost)*(1+mu)):Math.round(grandTotal*(1+mu));
      h+='<div class="price-total"><span>Room total'+(parseFloat(room.laborOverride)>0?' <span class="min-badge">(override)</span>':'')+(mu>0?' <span class="min-badge">+'+Math.round(mu*100)+'% markup</span>':'')+'</span><span>$'+displayTotal.toLocaleString()+'</span></div>';
      h+='<div style="display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap">';
      h+='<span style="font-size:12px;color:#888">Markup:</span>';
      [0,0.05,0.10,0.15,0.20].forEach(function(m){
        var on=Math.abs(mu-m)<0.001;
        var lbl=m===0?'None':(m*100)+'%';
        h+='<button class="diff-btn'+(on?' diff-btn-on':'')+'" data-markup="'+m+'" style="padding:5px 12px;font-size:12px">'+lbl+'</button>';
      });
      var isCustom=mu>0&&![0.05,0.10,0.15,0.20].some(function(m){return Math.abs(mu-m)<0.001;});
      h+='<input type="number" id="custom-markup" value="'+(isCustom?Math.round(mu*100):'')+'" placeholder="custom %" min="0" max="100" step="1" style="width:90px;font-size:12px" title="Custom markup %">';
      h+='</div>';
      if(mu>0){
        h+='<div class="info-note" style="margin-top:6px">'+Math.round(mu*100)+'% markup applied on $'+grandTotal.toLocaleString()+' base — final: $'+displayTotal.toLocaleString()+'</div>';
      }
    }
  }

  h+='<hr class="divider">';
  h+='<div class="section-head">Room summary notes</div>';
  h+='<textarea id="room-notes-ta" placeholder="Summarize what you did for this room — materials confirmed, special considerations, anything the client said, reminders for the install day..." style="width:100%;min-height:120px;padding:10px;border:1px solid #d0d0d0;border-radius:8px;font-size:14px;font-family:inherit;color:#1a1a1a;background:#fff;resize:vertical;line-height:1.5;outline:none" onfocus="this.style.borderColor=\'#2563eb\'" onblur="this.style.borderColor=\'#d0d0d0\'">'+(room.roomNotes||'')+'</textarea>';
  h+='<hr class="divider"><button class="btn-danger" id="bdr">Delete this room</button></div>';
  return h;
}

  var h='';
  room.openings.forEach(function(op,idx){
    var ow=parseFloat(op.width)||0,owIn=ow,sf=pw>0?Math.floor((owIn-2-pw)/pw):0,q=pw>0&&sf>=1;
    var tag=pw>0?(sf>=1?'<span class="tag tag-ok">Qualifies -- '+sf+' strip'+(sf!==1?'s':'')+' deducted</span>':'<span class="tag tag-no">Too narrow to deduct</span>'):'<span class="tag tag-no" style="opacity:0.5">Enter paper width to check</span>';
    h+='<div class="seg-card">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
    h+='<select class="opc" data-idx="'+idx+'" data-key="type" style="font-size:13px;font-weight:600;border:none;background:none;padding:0;width:auto;color:#1a1a1a;cursor:pointer">';
    ['Door','Window','Cabinet','Archway','Other'].forEach(function(t){h+='<option'+(op.type===t?' selected':'')+'>'+t+'</option>';});
    h+='</select>';
    h+='<button class="iconbtn bdo" data-idx="'+idx+'">&times;</button></div>';
    h+='<div class="grid2">';
    h+='<div class="field"><label>Width (inches)</label><input type="number" class="opb" data-idx="'+idx+'" data-key="width" value="'+(op.width||'')+'" placeholder="36" step="1"></div>';
    h+='<div class="field"><label>Height above (in)</label><input type="number" class="opb" data-idx="'+idx+'" data-key="above" value="'+(op.above||'')+'" placeholder="0" step="0.5"></div>';
    h+='<div class="field"><label>Height below (in)</label><input type="number" class="opb" data-idx="'+idx+'" data-key="below" value="'+(op.below||'')+'" placeholder="0" step="0.5"></div>';
    h+='<div class="field" style="justify-content:center;align-items:flex-end;display:flex">'+tag+'</div></div></div>';
  });
  return h;
}

function rCeil(room){
  var ceil=room.ceiling;
  var h='<div style="margin-top:10px;padding:1rem;background:#f8f8f8;border-radius:8px;border:1px solid #e0e0e0">';
  h+='<div class="grid2" style="margin-bottom:10px"><div class="field"><label>Paper direction</label><select id="bcd">';
  h+='<option value="length"'+(ceil.direction==='length'?' selected':'')+'>Along the length</option>';
  h+='<option value="width"'+(ceil.direction==='width'?' selected':'')+'>Along the width</option>';
  h+='</select></div></div>';
  h+='<div class="section-head" style="margin-top:0">Ceiling sections</div>';
  ceil.sections.forEach(function(sec,idx){
    h+='<div class="seg-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:13px;font-weight:600">Section '+(idx+1)+'</span>';
    if(ceil.sections.length>1)h+='<button class="iconbtn bdcs" data-secid="'+sec.id+'">&times;</button>';
    h+='</div><div class="grid2">';
    h+='<div class="field"><label>Length (ft)</label><input type="number" class="clb" data-secid="'+sec.id+'" data-key="length" value="'+(sec.length||'')+'" placeholder="10" step="0.25"></div>';
    h+='<div class="field"><label>Width (ft)</label><input type="number" class="clb" data-secid="'+sec.id+'" data-key="width" value="'+(sec.width||'')+'" placeholder="5" step="0.25"></div>';
    h+='</div></div>';
  });
  h+='<button id="bacs" style="width:100%;margin-top:4px">+ Add section</button></div>';
  return h;
}
